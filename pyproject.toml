[project]
name = "inference-tool"
version = "0.1.0"
description = "A lightweight NumPy-based Gemma model inference engine"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "huggingface-hub>=0.27.0",
    "ipykernel>=7.1.0",
    "ipywidgets>=8.1.8",
    "pytest>=9.0.2",
    "torch>=2.9.1",
    "transformers>=4.57.5",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
